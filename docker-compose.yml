# SCGRep deployment.
#
# Redis is already running as a service named "redis" on the shared "jztnet"
# docker bridge network (per the deployment brief). SCGRep joins that existing
# external network and reaches Redis at redis:6379.
#
#   docker compose up --build

services:
  scgrep:
    build: .
    image: scgrep:latest
    container_name: scgrep
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"   # Prometheus metrics (METRICS_PORT)
    networks:
      - jztnet

networks:
  jztnet:
    # Pre-existing bridge network hosting the provisioned Redis service.
    name: jztnet
    external: true
