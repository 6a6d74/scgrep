# SCGRep deployment (self-contained).
#
# This stack runs everything it needs: a managed Redis, the SCGRep service, and
# a Traefik reverse proxy. All three share a single Compose-managed bridge
# network named "traefik".
#
# SCGRep waits for Redis via `depends_on` (Redis has a healthcheck), and reaches
# it at redis:6379. Ingress is handled by Traefik using the file provider
# (./traefik/dynamic.yml); SCGRep does not publish its port directly. With the
# defaults below:
#
#   http://localhost/metrics     (metrics, via Traefik on :80)
#   http://localhost/dashboard/  (Traefik dashboard, behind HTTP basic auth)
#
#   docker compose up --build

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      # File provider (no docker socket needed): routing is defined in
      # ./traefik/dynamic.yml, which points at the scgrep service by name and
      # exposes the dashboard behind HTTP basic auth.
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Redirect all plain HTTP to HTTPS so endpoints are published over TLS.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Dashboard enabled but NOT insecure: it is served through the `websecure`
      # entrypoint behind the basic-auth middleware (see dynamic.yml).
      - "--api.dashboard=true"
      # Liveness endpoint (/ping) used by the container healthcheck below.
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # Gitignored basic-auth credentials; create from the example first:
      #   cp traefik/dashboard-users.example traefik/dashboard-users
      - ./traefik/dashboard-users:/etc/traefik/dashboard-users:ro
    healthcheck:
      # The distroless Traefik image ships no shell/curl; use its built-in
      # healthcheck CLI against the /ping endpoint enabled above.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - traefik

  redis:
    image: redis:7-alpine
    # No explicit container_name: reachable as "redis" on the network via its
    # Compose service name, without colliding with any other "redis" container.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - traefik

  scgrep:
    build: .
    image: scgrep:latest
    container_name: scgrep
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # An optional .env can supply/override extra values; anything set in the
    # `environment` block below takes precedence over it (Compose evaluates
    # `environment` after `env_file`).
    env_file:
      - path: .env
        required: false
    environment:
      SENSOR_CENTRE_ID: io-wis2dev-myinstance-sensor-centre-global-replay
      SUBSCRIPTION_TOPICS: "cache/a/wis2/ca-eccc-msc/data/core/weather/surface-based-observations/synop,monitor/a/wis2/ca-eccc-msc"
      GLOBAL_BROKER_URLS: "mqtts://everyone:everyone@globalbroker.meteo.fr:8883"
      GLOBAL_REPLAY_CENTRE_IDS: ca-eccc-msc-global-replay
      GLOBAL_REPLAY_URLS: "https://wis2-grep.weather.gc.ca"
      REDIS_URL: redis:6379
      METRICS_ENDPOINT: /metrics
      METRICS_PORT: "8000"
      # Shortened to 60s to speed up testing/iteration. For an operational
      # deployment these would normally both be 300s.
      TIME_LAG: "60"
      TEST_INTERVAL: "60"
    # No published ports: Traefik fronts the metrics endpoint, reaching this
    # container by service name (scgrep:8000) over the shared network.
    healthcheck:
      # Probe the metrics endpoint (honours METRICS_PORT/METRICS_ENDPOINT).
      # No curl/wget in the slim image, so use Python; urlopen raises on non-200.
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          port = os.environ.get("METRICS_PORT", "8000")
          endpoint = os.environ.get("METRICS_ENDPOINT", "/metrics")
          urllib.request.urlopen(f"http://localhost:{port}{endpoint}", timeout=5)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik

networks:
  traefik:
    # Compose-managed bridge network shared by all services in this stack.
    name: traefik
