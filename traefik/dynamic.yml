# Traefik dynamic configuration (file provider).
#
# Routes the SCGRep metrics endpoint and the Traefik dashboard. SCGRep is
# reached by its service name on the shared network, so no docker socket access
# is required.

http:
  routers:
    # Metrics are published over HTTPS (TLS terminated by Traefik). Plain HTTP
    # is redirected to HTTPS at the entrypoint level (see docker-compose.yml).
    scgrep:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/metrics`)"
      service: scgrep
      tls: {}

    # Traefik dashboard/API, served over HTTPS and protected by HTTP basic auth.
    # Reachable at https://<host>/dashboard/
    dashboard:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      service: api@internal
      middlewares:
        - dashboard-auth
      tls: {}

  middlewares:
    dashboard-auth:
      basicAuth:
        # Credentials live in a gitignored htpasswd file. Create it before
        # starting the stack:
        #   cp traefik/dashboard-users.example traefik/dashboard-users
        # then set a real credential (default is admin / changeme — CHANGE IT):
        #   htpasswd -nB admin > traefik/dashboard-users
        #   openssl passwd -apr1 'your-password' | sed 's/^/admin:/' > traefik/dashboard-users
        usersFile: /etc/traefik/dashboard-users

  services:
    scgrep:
      loadBalancer:
        servers:
          # METRICS_PORT on the scgrep service.
          - url: "http://scgrep:8000"

# TLS certificate served for HTTPS. If the mkcert-generated files below are
# present (see README), Traefik serves them as the default certificate — trusted
# by any machine that has run `mkcert -install`. If they are absent, Traefik
# falls back to its built-in self-signed certificate (browser warning).
tls:
  certificates:
    - certFile: /etc/traefik/certs/localhost.pem
      keyFile: /etc/traefik/certs/localhost-key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/localhost.pem
        keyFile: /etc/traefik/certs/localhost-key.pem
