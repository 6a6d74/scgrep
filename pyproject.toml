[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scgrep"
version = "0.1.0"
description = "Sensor Centre Global Replay service — WIS2 Global Replay performance testing"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "redis>=5.0,<6",
    "requests>=2.31,<3",
    "prometheus-client>=0.20,<1",
]

[project.scripts]
scgrep = "scgrep.main:main"

[tool.setuptools.packages.find]
include = ["scgrep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
